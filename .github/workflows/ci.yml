name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "papers/**"
      - "rfcs/**"
      - "*.md"
  # No path filter here, since every job is a required check and skipped jobs never report.
  pull_request:
    branches:
      - main
      - release

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os:
          - { name: ubuntu, version: ubuntu-latest }
          - { name: macos, version: macos-15-intel }
          - { name: macos-arm, version: macos-15 }
    name: ${{ matrix.os.name }}
    runs-on: ${{ matrix.os.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt

      - name: Verify Cargo source interface
        run: |
          cargo fmt --all --check
          cargo test --locked -p luau0-src
          cargo clippy --locked --workspace --all-features --all-targets -- -D warnings
          cargo test --locked -p luau-source-consumer
          cargo test --locked -p luau-source-consumer --features codegen
          cargo test --locked -p luau-source-consumer --features vector4
          cargo test --locked -p luau-source-consumer --features codegen,vector4
          cargo package --locked -p luau0-src
          python3 Rust/VerifyBuild.py

      - name: Verify Clang runtime selection
        if: matrix.os.name == 'ubuntu'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang libc++-dev libc++abi-dev
          python3 Rust/VerifyBuild.py --libcxx CXXFLAGS
          python3 Rust/VerifyBuild.py --libcxx LUAU_CXXFLAGS

      - name: Work around ASLR+ASAN compatibility
        run: sudo sysctl -w vm.mmap_rnd_bits=28
        if: matrix.os.name == 'ubuntu'

      - name: Build tests
        run: make -j2 config=sanitize werror=1 native=1 luau-tests

      - name: Run tests
        run: |
          ./luau-tests
          ./luau-tests --fflags=true

      - name: Run extra conformance tests
        run: |
          ./luau-tests -ts=Conformance -O2
          ./luau-tests -ts=Conformance -O2 --fflags=true
          ./luau-tests -ts=Conformance --codegen
          ./luau-tests -ts=Conformance --codegen --fflags=true
          ./luau-tests -ts=Conformance --codegen -O2
          ./luau-tests -ts=Conformance --codegen -O2 --fflags=true

      - name: Build CLI
        run: |
          make -j2 config=sanitize werror=1 luau luau-analyze luau-compile
          ./luau tests/conformance/assert.luau
          ./luau-analyze tests/conformance/assert.luau
          ./luau-compile tests/conformance/assert.luau

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: Win32, rust-target: i686-pc-windows-msvc }
          - { arch: x64, rust-target: x86_64-pc-windows-msvc }
    name: windows (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.rust-target }}

      - name: Verify Cargo source interface
        shell: bash
        run: |
          cargo test --locked -p luau0-src --target ${{ matrix.rust-target }}
          cargo test --locked -p luau-source-consumer --target ${{ matrix.rust-target }}
          cargo test --locked -p luau-source-consumer --target ${{ matrix.rust-target }} --features codegen
          cargo test --locked -p luau-source-consumer --target ${{ matrix.rust-target }} --features vector4
          cargo test --locked -p luau-source-consumer --target ${{ matrix.rust-target }} --features codegen,vector4
          python Rust/VerifyBuild.py --target ${{ matrix.rust-target }}

      - name: CMake configure
        run: cmake . -A ${{ matrix.arch }} -DLUAU_WERROR=ON -DLUAU_NATIVE=ON

      - name: CMake build
        run: cmake --build . --target Luau.UnitTest Luau.Conformance --config Debug

      - name: Run tests
        shell: bash
        run: |
          Debug/Luau.UnitTest.exe
          Debug/Luau.Conformance.exe
          Debug/Luau.UnitTest.exe --fflags=true
          Debug/Luau.Conformance.exe --fflags=true

      - name: Run extra conformance tests
        shell: bash
        run: |
          Debug/Luau.Conformance.exe -O2
          Debug/Luau.Conformance.exe -O2 --fflags=true
          Debug/Luau.Conformance.exe --codegen
          Debug/Luau.Conformance.exe --codegen --fflags=true
          Debug/Luau.Conformance.exe --codegen -O2
          Debug/Luau.Conformance.exe --codegen -O2 --fflags=true

      - name: Build CLI
        shell: bash
        run: |
          cmake --build . --target Luau.Repl.CLI Luau.Analyze.CLI Luau.Compile.CLI --config Debug
          Debug/luau tests/conformance/assert.luau
          Debug/luau-analyze tests/conformance/assert.luau
          Debug/luau-compile tests/conformance/assert.luau
